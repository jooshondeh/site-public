# Repository destination: .github/workflows/static.yml
name: Deploy production site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant each job only the permissions it needs.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate source
        run: python3 scripts/validate_site.py .

      - name: Build clean deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/.well-known

          cp \
            index.html \
            404.html \
            robots.txt \
            sitemap.xml \
            social-preview.png \
            nexgenbinary-logo.png \
            favicon.ico \
            favicon.svg \
            favicon-16x16.png \
            favicon-32x32.png \
            favicon-192x192.png \
            favicon-512x512.png \
            apple-touch-icon.png \
            _site/

          cp -R assets book privacy terms _site/

          printf '%s\n' 'nexgenbinary.com' > _site/CNAME
          : > _site/.nojekyll

          cat > _site/.well-known/security.txt <<'EOF'
          Contact: mailto:info@nexgenbinary.com
          Expires: 2027-07-24T23:59:59Z
          Preferred-Languages: en
          Canonical: https://nexgenbinary.com/.well-known/security.txt
          EOF

      - name: Validate deployment artifact
        run: python3 scripts/validate_site.py _site --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _site
          retention-days: 3
          include-hidden-files: true

  # Schedule deployment only after the upload job has finished.
  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
